<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Jungles.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #C3F300;
            --secondary-color: #081523;
            --bg-color: #081523;
            --text-color: #FFFFFF;
            --light-text: #B3B9C1;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            display: flex;
            background-color: rgba(255, 255, 255, 0.03);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .content {
            padding: 60px;
            text-align: left;
            flex: 1;
        }

        .logo-container {
            margin-bottom: 40px;
            display: inline-block;
            padding: 15px;
            border-radius: 50%;
            background-color: var(--primary-color);
        }

        .logo {
            width: 60px;
            height: auto;
            object-fit: contain;
            border-radius: 50%;
            display: block;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 20px;
            line-height: 1.2;
        }

        p {
            font-size: 1.1rem;
            color: var(--light-text);
            margin-bottom: 30px;
            max-width: 500px;
        }

        .email-form {
            margin: 30px 0;
            display: flex;
            max-width: 500px;
        }

        .email-input {
            flex: 1;
            padding: 16px 18px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            color: var(--text-color);
            outline: none;
            transition: all 0.3s ease;
        }

        .email-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .email-input:focus {
            border-color: var(--primary-color);
            background-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(195, 243, 0, 0.1);
        }

        .submit-btn {
            padding: 16px 24px;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            border: none;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background-color: #D1FF00;
            transform: translateY(-1px);
        }

        .social-links {
            margin-top: 40px;
        }

        .social-links a {
            display: inline-block;
            margin-right: 20px;
            color: var(--light-text);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .social-links a:hover {
            color: var(--primary-color);
        }

        .highlight {
            color: var(--primary-color);
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                max-width: 500px;
            }

            .content {
                padding: 40px 30px;
                text-align: center;
            }

            .logo-container {
                display: flex;
                justify-content: center;
                margin-bottom: 30px;
                margin: 0 auto 30px;
            }

            .email-form {
                flex-direction: column;
                margin: 20px auto;
            }

            .email-input {
                border-radius: 8px;
                margin-bottom: 10px;
                width: 100%;
            }

            .submit-btn {
                border-radius: 8px;
                width: 100%;
            }

            h1 {
                font-size: 2.2rem;
            }

            p {
                margin-left: auto;
                margin-right: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
            <div class="logo-container">
                <img src="https://i.imgur.com/lLY7Pfd.png" alt="Jungles.ai Logo" class="logo">
            </div>
            <h1>Coming Soon</h1>
            <p>We're building something <span class="highlight">amazing</span> for you. Our new platform will be
                launching soon with innovative
                solutions to transform your experience.</p>
            <div class="email-form">
                <input type="email" placeholder="Enter your email address" class="email-input">
                <button class="submit-btn">Notify Me</button>
            </div>
        </div>
    </div>
</body>

</html>
