<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Jungles.ai</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 600px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        h1 {
            color: #2f3640;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #555;
        }

        .logo {
            margin-bottom: 30px;
            max-width: 100%;
            height: auto;
        }

        .email-form {
            margin: 30px 0;
        }

        .email-input {
            padding: 12px 15px;
            width: 70%;
            max-width: 300px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            margin-right: 10px;
        }

        .submit-btn {
            padding: 12px 20px;
            background-color: #2f3640;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .submit-btn:hover {
            background-color: #1e272e;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .email-form {
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .email-input {
                width: 100%;
                margin-right: 0;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="https://i.imgur.com/lLY7Pfd.png" alt="Jungles.ai Logo" class="logo">
        <h1>Coming Soon</h1>
        <p>We're working hard to bring you something amazing. Our new platform will be launching soon!</p>
        <div class="email-form">
            <input type="email" placeholder="Enter your email" class="email-input">
            <button class="submit-btn">Notify Me</button>
        </div>
        <p>Stay tuned for updates about our launch date.</p>
    </div>
</body>

</html>
